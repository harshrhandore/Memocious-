[build]
command = "npm run build"
publish = ".next"

[build.environment]
NODE_VERSION = "24.19.0"
NEXT_DISABLE_NETLIFY_EDGE = "true"

[dev]
command = "npm run dev"
targetPort = 3000
framework = "#custom"

# Preserve the Next.js SSR/API handler routing for manual CLI deploys.
[[redirects]]
from = "/_next/static/*"
to = "/static/:splat"
status = 200

[[redirects]]
from = "/_next/image*"
to = "/.netlify/builders/_ipx"
status = 200

[[redirects]]
from = "/api/*"
to = "/.netlify/functions/___netlify-handler"
status = 200

[[redirects]]
from = "/*"
to = "/.netlify/functions/___netlify-handler"
status = 200
