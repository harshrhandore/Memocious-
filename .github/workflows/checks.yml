name: Memocious checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:db
      - run: npm run scan:secrets
      - run: npm audit --audit-level=high
      - run: npm run build
  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install semgrep==1.182.1
      - name: Scan application and server jobs with OWASP rules
        run: semgrep scan --config p/owasp-top-ten --metrics off --disable-version-check --strict --error --json-output semgrep.json src netlify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-owasp
          path: semgrep.json
          retention-days: 7
# Hosted E2E/ZAP and actual Supabase identity/storage checks remain release gates.
